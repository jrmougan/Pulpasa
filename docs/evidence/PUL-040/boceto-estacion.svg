<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="sans-serif" font-size="14">
  <title>PUL-040: boceto de la estación de condimentos y de los distintivos de la caja</title>
  <rect width="900" height="560" fill="#f7f3ea"/>
  <!-- Planta: 1 m = 100 px -->
  <text x="20" y="28" font-size="18" font-weight="bold">Estación de condimentos (vista cenital, 1 m = 100 px)</text>
  <text x="250" y="62" fill="#555">COCINA: olla, nevera, corte</text>
  <text x="200" y="88" fill="#1f5fa8">J1 ↓ deja la caja en la bandeja · repone cachelos</text>
  <line x1="20" y1="100" x2="520" y2="100" stroke="#1f5fa8" stroke-dasharray="6 6"/>
  <text x="530" y="104" fill="#1f5fa8">lado de PASE</text>
  <!-- mostrador 4,5 x 1,2 m -->
  <rect x="40" y="110" width="450" height="120" rx="6" fill="#c9a77a" stroke="#6b4a2b" stroke-width="2"/>
  <!-- bandeja -->
  <rect x="150" y="120" width="200" height="45" fill="#e8dcc6" stroke="#6b4a2b"/>
  <text x="200" y="148">BANDEJA</text>
  <rect x="290" y="128" width="40" height="38" fill="#fff" stroke="#333"/>
  <text x="293" y="150" font-size="11">caja</text>
  <!-- cuenco -->
  <circle cx="90" cy="165" r="32" fill="#f1e2a8" stroke="#6b4a2b"/>
  <text x="62" y="160" font-size="12">Cachelos</text>
  <text x="74" y="177" font-size="12">2 / 3</text>
  <!-- dispensadores (≥0,9 m entre centros) -->
  <g font-size="12" text-anchor="middle">
    <circle cx="175" cy="205" r="18" fill="#e9893a"/><text x="175" y="209">DUL</text>
    <circle cx="265" cy="205" r="18" fill="#c0392b"/><text x="265" y="209" fill="#fff">PIC</text>
    <circle cx="355" cy="205" r="18" fill="#ffffff" stroke="#333"/><text x="355" y="209">SAL</text>
    <circle cx="445" cy="205" r="18" fill="#9bb33a"/><text x="445" y="209">ACE</text>
  </g>
  <line x1="20" y1="240" x2="520" y2="240" stroke="#2e8b57" stroke-dasharray="6 6"/>
  <text x="530" y="244" fill="#2e8b57">lado de CONDIMENTAR</text>
  <text x="150" y="266" fill="#2e8b57">J2 ↑ usa dispensadores y cuenco · recoge y entrega</text>
  <text x="250" y="292" fill="#555">PUESTOS DE ENTREGA 1–4</text>
  <!-- rodeo -->
  <path d="M 500 170 C 560 170, 560 250, 500 255" fill="none" stroke="#888" stroke-width="2" marker-end="url(#a)"/>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#888"/></marker></defs>
  <text x="565" y="200" fill="#555" font-size="12">rodeo 6–10 m</text>
  <text x="565" y="216" fill="#555" font-size="12">(planta de PUL-041)</text>
  <text x="40" y="320" font-size="12" fill="#333">Largo ≈ 4,5 m · fondo ≈ 1,2 m · dispensadores solo desde el lado de condimentar · bandeja y cuenco desde los dos lados</text>

  <!-- Distintivos -->
  <text x="20" y="365" font-size="18" font-weight="bold">Distintivos: ticket y caja con el mismo orden e iconos</text>
  <rect x="40" y="385" width="260" height="130" rx="8" fill="#fffdf6" stroke="#333"/>
  <text x="55" y="408">#2  Pulpo · caja media</text>
  <g>
    <circle cx="70" cy="440" r="14" fill="#c0392b"/><text x="70" y="445" text-anchor="middle" fill="#fff" font-size="11">PIC</text>
    <path d="M 78 448 l 4 -9 l 4 9 z" fill="#ffcc00" stroke="#333"/>
    <circle cx="104" cy="440" r="14" fill="#ffffff" stroke="#333"/><text x="104" y="445" text-anchor="middle" font-size="11">SAL</text>
    <circle cx="138" cy="440" r="14" fill="#9bb33a"/><text x="138" y="445" text-anchor="middle" font-size="11">ACE</text>
  </g>
  <rect x="55" y="475" width="230" height="12" fill="#ddd"/><rect x="55" y="475" width="150" height="12" fill="#2e8b57"/>
  <text x="55" y="505" font-size="12" fill="#555">Ticket (HUD), iconos 28 px</text>

  <g transform="translate(420,0)">
    <g>
      <circle cx="80" cy="420" r="12" fill="#c0392b"/><text x="80" y="424" text-anchor="middle" fill="#fff" font-size="9">PIC</text>
      <path d="M 87 428 l 3 -7 l 3 7 z" fill="#ffcc00" stroke="#333"/>
      <circle cx="107" cy="420" r="12" fill="#ffffff" stroke="#333"/><text x="107" y="424" text-anchor="middle" font-size="9">SAL</text>
      <circle cx="134" cy="420" r="12" fill="#9bb33a"/><text x="134" y="424" text-anchor="middle" font-size="9">ACE</text>
    </g>
    <line x1="107" y1="434" x2="107" y2="458" stroke="#999" stroke-dasharray="3 3"/>
    <text x="150" y="450" font-size="12" fill="#555">0,35 m sobre la tapa, billboard</text>
    <rect x="96" y="460" width="22" height="20" fill="#d9b98a" stroke="#6b4a2b"/>
    <text x="40" y="505" font-size="12" fill="#555">Caja en el mundo (≈ 22 px), pegatinas 24 px, orden canónico</text>
    <text x="40" y="525" font-size="12" fill="#555">pimentón → sal → aceite → cachelos · picante con marca de llama</text>
  </g>
</svg>
