  <g transform="translate(576, 860)">
    <rect x="0" y="0" width="594" height="172" rx="8" fill="#EDE8DF" stroke="#1D3557" stroke-width="2"/>
    <text x="16" y="28" class="n">Reglas cerradas para los 4 puntos débiles de PUL-180 (AC3):</text>
    <text x="16" y="54" class="m">1. Cartel superior: env_sign y env_board usan mat_hidden_alpha.tres (alfa=0); queda solo tent_plate.</text>
    <text x="16" y="78" class="m">2. Números de puesto: glifos macizos con outline_size=0 (#1D3557 s/ #F7F4EC y #F7F4EC s/ #1D3557, 11.24:1).</text>
    <text x="16" y="102" class="m">3. Textura env_plate: prohibidas las texturas PBR 3D; solo se permite env_plate (PulpaSA) e iconos planos D26.</text>
    <text x="16" y="126" class="m">4. SSAO y post-proceso: SSAO suave activo (radius=0.45, intensity=1.1); 0 Bulbs, 0 glow, 0 LUT, 0 Vignette.</text>
    <text x="16" y="152" class="m">Biblioteca completa: 18 recursos .tres en godot/assets/materials/v3/ (límite AC1 &lt;= 20 .tres).</text>
  </g>

