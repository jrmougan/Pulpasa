<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 680" font-family="sans-serif" font-size="13">
  <title>Pulpasa — lámina de referencia (obra propia, licencia propia)</title>
  <rect width="960" height="680" fill="#F1E6CC"/>
  <text x="20" y="30" font-size="20" font-weight="bold" fill="#34302E">Pulpasa · lámina de referencia de arte (PUL-042)</text>
  <!-- paleta -->
  <g transform="translate(20,50)">
    <text y="0" font-weight="bold">Paleta base</text>
    <g font-size="9" fill="#34302E">
      <rect y="10" width="70" height="40" fill="#D9A86C"/><text x="0" y="62">D9A86C</text>
      <rect x="80" y="10" width="70" height="40" fill="#B07A45"/><text x="80" y="62">B07A45</text>
      <rect x="160" y="10" width="70" height="40" fill="#6E4A2B"/><text x="160" y="62">6E4A2B</text>
      <rect x="240" y="10" width="70" height="40" fill="#C8672E"/><text x="240" y="62">cobre C8672E</text>
      <rect x="320" y="10" width="70" height="40" fill="#34302E"/><text x="320" y="62">34302E</text>
      <rect x="400" y="10" width="70" height="40" fill="#A9B0B5"/><text x="400" y="62">A9B0B5</text>
      <rect x="480" y="10" width="70" height="40" fill="#9C8566"/><text x="480" y="62">tierra 9C8566</text>
      <rect x="560" y="10" width="70" height="40" fill="#7DA05A"/><text x="560" y="62">7DA05A</text>
      <rect x="640" y="10" width="70" height="40" fill="#2F6FB5"/><text x="640" y="62">J1 2F6FB5</text>
      <rect x="720" y="10" width="70" height="40" fill="#E0A02E"/><text x="720" y="62">J2 E0A02E</text>
      <rect x="800" y="10" width="70" height="40" fill="#C9483D"/><text x="800" y="62">C9483D</text>
    </g>
  </g>
  <!-- pulpo crudo / cocido -->
  <g transform="translate(20,150)">
    <text font-weight="bold">Pulpo crudo (lacio, pálido) vs cocido (enroscado, saturado)</text>
    <g transform="translate(80,60)">
      <ellipse cx="0" cy="0" rx="34" ry="28" fill="#C9B0BC"/>
      <path d="M-30 15 Q-60 50 -70 80 M-15 25 Q-25 65 -40 95 M0 28 Q0 70 0 100 M15 25 Q25 65 40 95 M30 15 Q60 50 70 80" stroke="#C9B0BC" stroke-width="12" fill="none" stroke-linecap="round"/>
      <circle cx="-30" cy="-5" r="3" fill="#9A8294"/><circle cx="-5" cy="-8" r="3" fill="#9A8294"/>
      <text x="-45" y="112" font-size="11">crudo C9B0BC</text>
    </g>
    <g transform="translate(260,60)">
      <ellipse cx="0" cy="0" rx="26" ry="22" fill="#B8283D"/>
      <path d="M-24 14 C-50 30 -50 60 -30 60 C-12 60 -18 40 -26 46 M-8 20 C-20 50 -4 70 10 55 M12 20 C28 40 44 40 46 58 C48 70 34 70 32 60 M24 12 C46 10 60 30 52 46" stroke="#B8283D" stroke-width="10" fill="none" stroke-linecap="round"/>
      <circle cx="-14" cy="-4" r="3" fill="#6E1A3A"/><circle cx="6" cy="-6" r="3" fill="#6E1A3A"/>
      <text x="-45" y="112" font-size="11">cocido B8283D</text>
    </g>
    <!-- cachelos -->
    <text x="400" y="0" font-weight="bold">Cachelos crudo vs cocido</text>
    <g transform="translate(450,80)">
      <ellipse cx="0" cy="0" rx="30" ry="20" fill="#8E6B47" stroke="#34302E" stroke-width="2"/>
      <ellipse cx="45" cy="25" rx="26" ry="18" fill="#8E6B47" stroke="#34302E" stroke-width="2"/>
      <text x="-30" y="110" font-size="11">crudo 8E6B47 (enteras)</text>
    </g>
    <g transform="translate(620,80)">
      <path d="M-30 0 L0 -12 L20 8 L-10 22 Z" fill="#F2D56B" stroke="#D8A93C" stroke-width="2"/>
      <path d="M10 -2 L40 -14 L56 8 L28 20 Z" fill="#F2D56B" stroke="#D8A93C" stroke-width="2"/>
      <path d="M-4 24 L26 18 L40 40 L8 46 Z" fill="#F2D56B" stroke="#D8A93C" stroke-width="2"/>
      <text x="-30" y="110" font-size="11">cocido F2D56B (partidas)</text>
    </g>
  </g>
  <!-- cajas y pegatinas -->
  <g transform="translate(20,390)">
    <text font-weight="bold">Platos de madera (3 tamaños) y pegatinas D18 sobre el borde frontal</text>
    <g transform="translate(110,70)">
      <ellipse rx="42" ry="18" fill="#D9A86C" stroke="#2F6FB5" stroke-width="5"/>
      <ellipse rx="34" ry="12" fill="#B07A45"/>
      <text x="-30" y="48" font-size="11">pequeña · aro azul</text>
    </g>
    <g transform="translate(260,70)">
      <ellipse rx="52" ry="22" fill="#D9A86C" stroke="#4E9B5F" stroke-width="5"/>
      <ellipse rx="43" ry="15" fill="#B07A45"/>
      <ellipse rx="30" ry="9" fill="#D4506A"/>
      <text x="-38" y="52" font-size="11">mediana · aro verde</text>
    </g>
    <g transform="translate(430,70)">
      <ellipse rx="62" ry="26" fill="#D9A86C" stroke="#C9483D" stroke-width="5"/>
      <ellipse rx="52" ry="18" fill="#B07A45"/>
      <ellipse rx="40" ry="12" fill="#D4506A"/>
      <circle cx="-30" cy="26" r="8" fill="#D6361F"/><circle cx="-10" cy="31" r="8" fill="#F7F4EC" stroke="#6E4A2B"/>
      <circle cx="10" cy="31" r="8" fill="#F2C230"/><circle cx="30" cy="26" r="8" fill="#F2D56B" stroke="#8E6B47"/>
      <text x="-50" y="64" font-size="11">grande · aro rojo + 4 pegatinas</text>
    </g>
    <g transform="translate(600,40)" font-size="11">
      <circle cx="10" cy="10" r="10" fill="#D6361F"/><text x="28" y="14">pimentón dulce (pimiento)</text>
      <circle cx="10" cy="38" r="10" fill="#8F1A14"/><text x="28" y="42">pimentón picante (pimiento + chispa)</text>
      <circle cx="10" cy="66" r="10" fill="#F7F4EC" stroke="#6E4A2B"/><text x="28" y="70">sal gorda (copos)</text>
      <circle cx="10" cy="94" r="10" fill="#F2C230"/><text x="28" y="98">aceite (gota)</text>
      <circle cx="10" cy="122" r="10" fill="#F2D56B" stroke="#8E6B47"/><text x="28" y="126">cachelos (patata)</text>
    </g>
  </g>
  <!-- caldeiro -->
  <g transform="translate(20,545)">
    <text font-weight="bold">Caldeiro de cobre sobre fogón (silueta)</text>
    <g transform="translate(80,70)">
      <path d="M-40 -20 Q-45 30 0 30 Q45 30 40 -20 Z" fill="#C8672E"/>
      <ellipse cy="-20" rx="40" ry="9" fill="#8A4220"/>
      <path d="M-40 -18 Q-58 -6 -44 4 M40 -18 Q58 -6 44 4" stroke="#E8914F" stroke-width="4" fill="none"/>
      <rect x="-46" y="32" width="92" height="8" fill="#34302E"/>
      <path d="M-14 32 Q-8 14 0 30 Q8 10 14 32 Z" fill="#FFB02E"/>
    </g>
    <text x="200" y="40" font-size="12">Entorno: carpa a rayas crema/rojo, farolillos #FFD27F, banderines azul/amarillo/verde,</text>
    <text x="200" y="60" font-size="12">tierra apisonada en la zona jugable, hierba y losas fuera. Cámara ortográfica fija ≈ 38°.</text>
    <text x="200" y="90" font-size="11">Lámina propia y esquemática: no contiene imágenes de terceros (D16).</text>
  </g>
</svg>
